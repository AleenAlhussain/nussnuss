name: nussnuss
description: NussNuss (نص نص) — split bills with friends. Flutter app for iOS and Android.
publish_to: none
version: 2.0.0+20

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

# Kept small: networking (and live updates) use dart:io, state uses ChangeNotifier, glass is BackdropFilter.
# Plugins only where the platform has to do the work.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.0
  # Session token in the iOS Keychain and Android Keystore.
  flutter_secure_storage: ^10.0.0
  # Opens payment links, WhatsApp and the privacy pages in the right app.
  url_launcher: ^6.3.0
  # The native share sheet: invite links, the "who owes who" card, exports.
  share_plus: ^13.0.0
  # Plus, Trip Pass and Looks through the App Store and Google Play.
  in_app_purchase: ^3.3.0
  # The coin's sheen follows the phone's tilt.
  sensors_plus: ^7.0.0
  # Pinned by flutter_localizations; `any` takes whatever version the Flutter SDK ships with.
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Amounts and big titles (Latin and Arabic, SIL Open Font License: assets/fonts/OFL.txt).
  fonts:
    - family: ReadexPro
      fonts:
        - asset: assets/fonts/ReadexPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/ReadexPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ReadexPro-Bold.ttf
          weight: 700
