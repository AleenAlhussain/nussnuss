# NussNuss: Postgres + API + web with one command.
#   docker compose up --build        → web on http://localhost:3000, API on http://localhost:4000
# For production, set strong values in a .env file next to this one (see .env.example).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nussnuss}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nussnuss}
      POSTGRES_DB: ${POSTGRES_DB:-nussnuss}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-nussnuss} -d ${POSTGRES_DB:-nussnuss}']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-nussnuss}:${POSTGRES_PASSWORD:-nussnuss}@db:5432/${POSTGRES_DB:-nussnuss}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      RUN_MIGRATIONS: 'true'
      APPLE_CLIENT_IDS: ${APPLE_CLIENT_IDS:-}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-http://localhost:3000}
      APPLE_ROOT_CA: ${APPLE_ROOT_CA:-}
      APPLE_BUNDLE_ID: ${APPLE_BUNDLE_ID:-}
      GOOGLE_PLAY_SERVICE_ACCOUNT: ${GOOGLE_PLAY_SERVICE_ACCOUNT:-}
      ANDROID_PACKAGE_NAME: ${ANDROID_PACKAGE_NAME:-app.nussnuss.nussnuss}
      ALLOW_DEV_PURCHASES: ${ALLOW_DEV_PURCHASES:-false}
      CRASH_REPORTS: ${CRASH_REPORTS:-}
      FCM_SERVICE_ACCOUNT: ${FCM_SERVICE_ACCOUNT:-}
      APNS_KEY: ${APNS_KEY:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_TOPIC: ${APNS_TOPIC:-}
      RATES_URL: ${RATES_URL:-https://open.er-api.com/v6/latest/{base}}
    ports:
      - '4000:4000'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:4000}
    restart: unless-stopped
    environment:
      APPLE_APP_ID: ${APPLE_APP_ID:-}
      ANDROID_CERT_SHA256: ${ANDROID_CERT_SHA256:-}
      ANDROID_PACKAGE_NAME: ${ANDROID_PACKAGE_NAME:-app.nussnuss.nussnuss}
    depends_on:
      - api
    ports:
      - '3000:3000'

  # A daily dump of the database, kept for 14 days (restore: gunzip -c file | psql).
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-nussnuss}
      PGPASSWORD: ${POSTGRES_PASSWORD:-nussnuss}
      PGDATABASE: ${POSTGRES_DB:-nussnuss}
    volumes:
      - backups:/backups
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        while true; do
          f=/backups/nussnuss-$$(date +%Y%m%d-%H%M).sql.gz
          pg_dump --no-owner | gzip > "$$f.tmp" && mv "$$f.tmp" "$$f" && echo "backup $$f"
          find /backups -name 'nussnuss-*.sql.gz' -mtime +14 -delete
          sleep 86400
        done

volumes:
  db-data:
  backups:
