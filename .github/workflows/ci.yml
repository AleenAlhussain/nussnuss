# NussNuss 2.0 CI: every push checks the shared rules, the API against a real Postgres, the web app in a
# real browser, both Docker images, and the Flutter app (analyze, tests, Android APK, iOS build).
name: CI

on:
  push:
    branches: [main, v2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  shared:
    name: Core rules, tokens, generated Dart
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Core tests and token contrast checks
        run: npm test
      - name: Generated Dart (tokens, currencies, strings) is up to date
        run: |
          npm run tokens
          node apps/mobile/tool/generate.mjs
          git diff --exit-code -- apps/mobile/lib || (echo "::error::Run 'npm run tokens && node apps/mobile/tool/generate.mjs' and commit the result." && exit 1)
      - name: Glossary (the same words on web, iPhone and Android)
        run: node scripts/glossary.mjs
      - name: Type-check the API and the web app
        run: |
          npm run typecheck -w @nussnuss/api
          npm run typecheck -w @nussnuss/web

  api:
    name: API end-to-end (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nussnuss
          POSTGRES_PASSWORD: nussnuss
          POSTGRES_DB: nussnuss_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nussnuss -d nussnuss_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://nussnuss:nussnuss@127.0.0.1:5432/nussnuss_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build:packages
      - run: npm run test:api

  web:
    name: Web end-to-end (Playwright + axe)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nussnuss
          POSTGRES_PASSWORD: nussnuss
          POSTGRES_DB: nussnuss_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nussnuss -d nussnuss_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://nussnuss:nussnuss@127.0.0.1:5432/nussnuss_test
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4000
      NEXT_TELEMETRY_DISABLED: 1
      # Test build only: shows the "turn on for testing" Plus button the tests use. Never in a release build.
      NEXT_PUBLIC_DEV_PURCHASES: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-screens
          path: apps/web/test-results/
          if-no-files-found: ignore

  docker:
    name: Docker images and compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Build and start Postgres, API and web
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Smoke test through the running containers
        run: |
          curl -fsS http://localhost:4000/health
          curl -fsS -o /dev/null -w 'web %{http_code}\n' http://localhost:3000/
          TOKEN=$(curl -fsS -X POST http://localhost:4000/auth/anonymous -H 'Content-Type: application/json' \
            -d '{"name":"CI","locale":"en"}' | node -pe 'JSON.parse(require("fs").readFileSync(0)).token')
          curl -fsS -X POST http://localhost:4000/groups -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"name":"Smoke","currency":"AED","members":["Sara"]}' | node -pe 'const g=JSON.parse(require("fs").readFileSync(0)); if (g.members.length !== 2) process.exit(1); "group ok: " + g.name'
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - run: docker compose down --volumes
        if: always()

  flutter:
    name: Flutter analyze, test, Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # publishes the preview build as a pre-release on pushes to v2
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Versions
        run: flutter --version
      - run: flutter pub get
      - name: Formatting
        run: dart format --output=none --set-exit-if-changed $(find lib test -name '*.dart' ! -name '*.g.dart')
      - run: flutter analyze
      - name: TypeScript results for the Dart parity test
        working-directory: .
        run: |
          npm ci
          npm run build -w @nussnuss/core
          node apps/mobile/tool/parity.mjs 300 > apps/mobile/test/parity.json
      - name: Run the tests
        run: |
          set -o pipefail
          flutter test --exclude-tags golden --reporter expanded 2>&1 | tee "$RUNNER_TEMP/flutter-test.log"
      - name: Compare the screens with the committed images
        run: |
          set -o pipefail
          if ls test/goldens/*.png >/dev/null 2>&1; then
            flutter test --tags golden --reporter expanded 2>&1 | tee -a "$RUNNER_TEMP/flutter-test.log"
          else
            echo "No committed screen images yet: the next step publishes the first set for review."
          fi
      - name: Show test failures as annotations
        if: failure()
        shell: python3 {0}
        run: |
          # Each failure block becomes one annotation, readable without opening the raw log.
          import os, re
          path = os.path.join(os.environ["RUNNER_TEMP"], "flutter-test.log")
          if os.path.exists(path):
              text = open(path, encoding="utf-8", errors="replace").read()
              blocks = re.findall(r"══╡ EXCEPTION CAUGHT BY .*?\n═{10,}", text, re.S) or [text[-8000:]]
              for b in blocks[:10]:
                  b = b[:20000].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print("::error title=flutter test::" + b)
      - name: Publish the screens for review (v2 branch)
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/v2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fresh images of every screen in light, dark and Arabic, plus any differences from the committed
          # ones, so the design can be checked without a phone. Not a release: a pre-release with a zip.
          flutter test --tags golden --update-goldens --reporter expanded || true
          (cd test && zip -qr "$RUNNER_TEMP/flutter-screens.zip" goldens failures 2>/dev/null) || true
          if [ -f "$RUNNER_TEMP/flutter-screens.zip" ]; then
            gh release delete v2-screens --yes --cleanup-tag 2>/dev/null || true
            gh release create v2-screens "$RUNNER_TEMP/flutter-screens.zip" --prerelease --target "$GITHUB_SHA" \
              --title "Flutter screens (build ${{ github.run_number }})" \
              --notes "Golden images of the Flutter app from commit ${GITHUB_SHA::7}: light, dark and Arabic. Commit them to apps/mobile/test/goldens to make them the reference."
          fi
      - name: Build the APK
        run: |
          set -o pipefail
          flutter build apk --release \
            --dart-define=API_URL=${{ vars.API_URL }} \
            --dart-define=WEB_URL=${{ vars.WEB_URL }} 2>&1 | tee "$RUNNER_TEMP/build.log"
          cp build/app/outputs/flutter-apk/app-release.apk "NussNuss-2.0-build${{ github.run_number }}.apk"
      - name: Show build errors as annotations
        if: failure()
        shell: python3 {0}
        run: |
          # Gradle's "What went wrong" and compiler errors, readable without opening the raw log.
          import os, re
          path = os.path.join(os.environ["RUNNER_TEMP"], "build.log")
          if os.path.exists(path):
              text = open(path, encoding="utf-8", errors="replace").read()
              parts = re.findall(r"\* What went wrong:.*?(?=\* Try:|\Z)", text, re.S)
              parts += [l for l in text.splitlines() if re.search(r"(^e: |error:|Error:|FAILURE)", l)][:30]
              out = "\n".join(parts)[:20000] or text[-6000:]
              print("::error title=build::" + out.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))
      - uses: actions/upload-artifact@v4
        with:
          name: nussnuss-android-apk
          path: apps/mobile/NussNuss-*.apk
      - name: Publish the preview build (v2 branch)
        if: github.event_name == 'push' && github.ref == 'refs/heads/v2'
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ vars.API_URL }}
        run: |
          gh release delete v2-preview --yes --cleanup-tag 2>/dev/null || true
          if [ -n "$API_URL" ]; then server="It talks to the API at $API_URL."; else server="No API address is set yet, so Get started will say you are offline. Host the API, set the API_URL repository variable, and the next build works."; fi
          gh release create v2-preview NussNuss-*.apk --prerelease --target "$GITHUB_SHA" \
            --title "NussNuss 2.0 preview (build ${{ github.run_number }})" \
            --notes "Flutter app from the v2 branch, commit ${GITHUB_SHA::7}. $server Signed with a debug key: for testing on a phone, not for Google Play."

  ios:
    name: Flutter iOS build (no signing)
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build for iPhone
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign --dart-define=API_URL=${{ vars.API_URL }} --dart-define=WEB_URL=${{ vars.WEB_URL }} 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Show build errors as annotations
        if: failure()
        shell: python3 {0}
        run: |
          import os, re
          path = os.path.join(os.environ["RUNNER_TEMP"], "build.log")
          if os.path.exists(path):
              text = open(path, encoding="utf-8", errors="replace").read()
              lines = [l for l in text.splitlines() if re.search(r"(error:|Error |\[!\]|CocoaPods|requires a higher minimum|Failed)", l)][:40]
              out = "\n".join(lines)[:20000] or text[-6000:]
              print("::error title=ios build::" + out.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))
